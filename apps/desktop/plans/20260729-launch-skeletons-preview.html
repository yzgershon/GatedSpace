<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GatedSpace launch skeletons — preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /*
   * The app's own dark theme values, copied from renderer/globals.css so the
   * contrast you judge here is the contrast you get. Dracula and the other
   * themes shift --accent, so the bars will read slightly differently there —
   * the skeleton is written against the token, not a fixed colour.
   */
  :root {
    --background: #151110;
    --foreground: #eae8e6;
    --card: #201e1c;
    --muted: #2a2827;
    --muted-foreground: #a8a5a3;
    --accent: #2a2827;
    --border: #2a2827;
  }
  body { background: var(--background); color: var(--foreground);
         font-family: ui-sans-serif, system-ui, sans-serif; }
  .bg-background { background: var(--background); }
  .bg-card       { background: var(--card); }
  .bg-accent     { background: var(--accent); }
  .bg-accent\/55 { background: color-mix(in oklab, var(--accent) 55%, transparent); }
  .border-border { border-color: var(--border); }
  .text-muted-foreground { color: var(--muted-foreground); }
  .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes pulse { 50% { opacity: .5 } }
  .label { color: var(--muted-foreground); font-size: 12px;
           text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body class="p-8">

<h1 class="mb-1 text-lg font-medium">Launch skeletons</h1>
<p class="mb-8 text-sm text-muted-foreground">
  What the first ~2 seconds of a launch looks like now, in place of a blank
  panel and "Workspace not found".
</p>

<div class="flex gap-8">

  <!-- ── Sidebar skeleton ───────────────────────────────────────────── -->
  <div>
    <p class="label mb-2">Sidebar</p>
    <div class="w-60 overflow-hidden rounded-lg border border-border bg-background">
      <div class="flex flex-col">
        <!-- project -->
        <div class="border-b border-border/45">
          <div class="flex min-h-9 w-full items-center gap-2 py-1 pr-2 pl-3">
            <div class="animate-pulse size-4 shrink-0 rounded bg-accent"></div>
            <div class="animate-pulse h-3.5 w-28 rounded bg-accent"></div>
          </div>
          <div class="flex flex-col pb-1">
            <div class="flex min-h-7 items-center gap-2 py-0.5 pr-2 pl-7">
              <div class="animate-pulse size-3.5 shrink-0 rounded bg-accent/55"></div>
              <div class="animate-pulse h-3 w-16 rounded bg-accent/55"></div>
            </div>
            <div class="flex min-h-7 items-center gap-2 py-0.5 pr-2 pl-7">
              <div class="animate-pulse size-3.5 shrink-0 rounded bg-accent/55"></div>
              <div class="animate-pulse h-3 w-24 rounded bg-accent/55"></div>
            </div>
          </div>
        </div>
        <!-- project -->
        <div class="border-b border-border/45">
          <div class="flex min-h-9 w-full items-center gap-2 py-1 pr-2 pl-3">
            <div class="animate-pulse size-4 shrink-0 rounded bg-accent"></div>
            <div class="animate-pulse h-3.5 w-36 rounded bg-accent"></div>
          </div>
          <div class="flex flex-col pb-1">
            <div class="flex min-h-7 items-center gap-2 py-0.5 pr-2 pl-7">
              <div class="animate-pulse size-3.5 shrink-0 rounded bg-accent/55"></div>
              <div class="animate-pulse h-3 w-20 rounded bg-accent/55"></div>
            </div>
            <div class="flex min-h-7 items-center gap-2 py-0.5 pr-2 pl-7">
              <div class="animate-pulse size-3.5 shrink-0 rounded bg-accent/55"></div>
              <div class="animate-pulse h-3 w-28 rounded bg-accent/55"></div>
            </div>
            <div class="flex min-h-7 items-center gap-2 py-0.5 pr-2 pl-7">
              <div class="animate-pulse size-3.5 shrink-0 rounded bg-accent/55"></div>
              <div class="animate-pulse h-3 w-16 rounded bg-accent/55"></div>
            </div>
          </div>
        </div>
        <!-- project -->
        <div>
          <div class="flex min-h-9 w-full items-center gap-2 py-1 pr-2 pl-3">
            <div class="animate-pulse size-4 shrink-0 rounded bg-accent"></div>
            <div class="animate-pulse h-3.5 w-24 rounded bg-accent"></div>
          </div>
          <div class="flex flex-col pb-1">
            <div class="flex min-h-7 items-center gap-2 py-0.5 pr-2 pl-7">
              <div class="animate-pulse size-3.5 shrink-0 rounded bg-accent/55"></div>
              <div class="animate-pulse h-3 w-24 rounded bg-accent/55"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Workspace + session skeleton ──────────────────────────────── -->
  <div class="min-w-0 flex-1">
    <p class="label mb-2">Workspace &amp; session pane</p>
    <div class="flex h-[620px] w-full flex-col overflow-hidden rounded-lg border border-border bg-background">

      <!-- tab strip -->
      <div class="flex h-9 shrink-0 items-center gap-1.5 border-b border-border px-2">
        <div class="animate-pulse h-6 w-36 rounded-md bg-accent"></div>
        <div class="animate-pulse h-6 w-24 rounded-md bg-accent/55"></div>
      </div>

      <div class="relative flex min-h-0 flex-1 flex-col">
        <!-- session header -->
        <div class="flex h-11 shrink-0 items-center gap-2 border-b border-border px-4">
          <div class="animate-pulse size-1.5 rounded-full bg-accent"></div>
          <div class="animate-pulse h-3.5 w-28 rounded bg-accent"></div>
          <div class="flex-1"></div>
          <div class="animate-pulse h-3.5 w-16 rounded bg-accent/55"></div>
        </div>

        <!-- transcript -->
        <div class="min-h-0 flex-1 overflow-hidden">
          <div class="flex w-full flex-col px-4 py-4">
            <div class="flex flex-col">
              <div class="animate-pulse h-5 w-52 rounded-md bg-accent"></div>
              <div class="mt-3 flex flex-col gap-2">
                <div class="animate-pulse h-3.5 w-[92%] rounded bg-accent/55"></div>
                <div class="animate-pulse h-3.5 w-[78%] rounded bg-accent/55"></div>
                <div class="animate-pulse h-3.5 w-[85%] rounded bg-accent/55"></div>
              </div>
            </div>
            <div class="mt-6 flex flex-col">
              <div class="animate-pulse h-5 w-36 rounded-md bg-accent"></div>
              <div class="mt-3 flex flex-col gap-2">
                <div class="animate-pulse h-3.5 w-[88%] rounded bg-accent/55"></div>
                <div class="animate-pulse h-3.5 w-[64%] rounded bg-accent/55"></div>
              </div>
            </div>
            <div class="mt-6 flex flex-col">
              <div class="animate-pulse h-5 w-44 rounded-md bg-accent"></div>
              <div class="mt-3 flex flex-col gap-2">
                <div class="animate-pulse h-3.5 w-[95%] rounded bg-accent/55"></div>
                <div class="animate-pulse h-3.5 w-[71%] rounded bg-accent/55"></div>
                <div class="animate-pulse h-3.5 w-[80%] rounded bg-accent/55"></div>
                <div class="animate-pulse h-3.5 w-[45%] rounded bg-accent/55"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- composer footprint -->
        <div class="flex shrink-0 justify-center px-4 pb-4">
          <div class="animate-pulse h-24 w-full max-w-3xl rounded-2xl bg-accent/55"></div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
